<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Note App</title>
  <link rel="stylesheet" href="Day 39.css">
</head>
<body>
  <div class="container">
    <h1>📝 My Notes</h1>

    <h2>Your Notes</h2>
    <div id="notesContainer"></div>
  </div>

  <script src="Day 39.js"></script>
</body>
</html>
